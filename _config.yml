# 1. Site Settings
title               : INDEX
owner               : "NightFyre"
url                : #
baseurl            : #
permalink           : /:title/
description         : "NightFyre's Public Documents"
markdown            : kramdown
statement           : "Designed by DeerRIDER, All Rights Reserved"
bgtext              : "ABCFGHKLMNPQRSVWXYZabcdefghijklmnopqrstuvwxyz@#$%&*+-;/[]<>~" # texts randomly displayed in background

# 2. Your Collections
# You can specify the order shown in Archive window. 
# Keep it null if you want to show items in alphabetic order.
collection_order    : 
  [
    "socom",
    "ps2",
    "pcsx2",
    "rpcs3",
    "reverse_engineering",
    "projects",
  ]
  collections:
   socom:
     output: false
     sort_by: date
     alias: "SOCOM"
   ps2:
     output: false
     sort_by: date
     alias: "PlayStation 2"
   pcsx2:
     output: false
     sort_by: date
     alias: "PCSX2"
   rpcs3:
     output: false
     sort_by: date
     alias: "RPCS3"
   reverse_engineering:
     output: false
     sort_by: date
     alias: "Reverse Engineering"
   projects:
     output: false
     sort_by: date
     alias: "Projects"

# 3. Comment settings（disqus.com）
disqus_username     : xCENTx

# 4. Default page settings (WILL BE overwriten by front-matters of a page)
defaults:
  -    
    scope:
      path          : ""  # an empty string here means all files in the project
    values:
      layout              : "post"      # which layout to use by default
      publish             : true        # whether to show by default      
      btn_text            : true        # whether show button text by default
      collection_list     : false       # whether show archive button by default
      home_btn            : true        # whether show home by default
      maximize            : true        # whether show maximize button by default
      encrypted_text      : false       # whether use encrytion function by default
      toc                 : true        # whether show table of content by default
      toc_level           : 3           # the toc depth by default
      author              : "NightFyre" # author name by default
      show_date           : true        # whether show date message by default
      category            :             # category by default
      post_list           : true        # whether show list of post by default      
      comment             : true
      footer              : true        # whether show footer by default

# 5. Social Media Accounts
email               : 
linkedin            : 
github              : "xCENTx"
gitlab              : 
website             : "https://nightfyre.xyz/"
twitter             : 
facebook            : 
instagram           : 
youtube             : 
steam               : 
weibo               :
      
# 6. Where things are
source              : .
destination         : ./_site
collections_dir     : collections
plugins_dir         : src/_plugins # takes an array of strings and loads plugins in that order
layouts_dir         : src/_layouts
data_dir            : src/_data
includes_dir        : src/_includes
sass:
  sass_dir          : src/_sass

# 7. Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  
gems: [jekyll-mermaid]

# 8. Others
# Cross-Origin Resource Sharing header
webrick:
  headers:
    Access-Control-Allow-Origin: "*"